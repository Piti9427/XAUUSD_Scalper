# PROPOSED - NOT APPLIED. Install only in the owner-approved deploy window (see RUNBOOK).
# Why: with the 2026-11-10 patch an invalid/expired review no longer crashes the runner (it stays BLOCKED
# and keeps managing any open position). This backoff only limits churn for *other* start failures
# (terminal not ready, ExecStartPre sha check, wine). Max delay is kept short (60 s) so a crashed runner
# with an OPEN position is re-supervised quickly. StartLimitIntervalSec=0 stays in the main unit on purpose:
# systemd must never give up and leave a position unmanaged.
# Requires systemd >= 254 (VM has 255.4). Delay sequence ~10,14,20,29,60,60...
[Service]
Restart=on-failure
RestartSec=10
RestartSteps=4
RestartMaxDelaySec=60
