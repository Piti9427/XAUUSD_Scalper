[project]
name = "xauusd-smc-system"
version = "1.0.0"
description = "Institutional SMC XAUUSD Trading System & Copilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nopparuj" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "deploy", "__pycache__"]
