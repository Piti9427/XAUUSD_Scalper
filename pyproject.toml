[project]
name = "xauusd-smc-system"
version = "1.0.0"
description = "Institutional SMC XAUUSD Trading System & Copilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nopparuj" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "deploy",
    "__pycache__",
    ".scratch",
    "docs",
    "data",
    "scripts/c22_selected",
    "scripts/c22h4",
    "scripts/trial30",
    "scripts/demo_runtime",
    "scripts/pure_b1",
    "scripts/research",
    "scripts/strategy.py",
    "scripts/ops/c22_forward_seal.py",
    "scripts/ops/c22_selected_readiness.py",
    "scripts/ops/c22_selected_watchdog.py",
    "scripts/ops/c22h4_readiness.py",
    "scripts/ops/mt5_wine_c22_selected.py",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402", "E741", "F841"]
"scripts/smoke_broker_identity.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
