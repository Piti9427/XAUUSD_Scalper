[project]
name = "xauusd-smc-system"
version = "1.0.0"
description = "Institutional SMC XAUUSD Trading System & Copilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Nopparuj" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "deploy",
    "__pycache__",
    ".scratch",
    "docs",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E741", "F841"]
"scripts/smoke_broker_identity.py" = ["E402"]
