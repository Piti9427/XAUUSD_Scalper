name: "CI Checks"

"on":
  push:
    branches:
      - "main"
      - "develop"
      - "feature/**"
      - "fix/**"
      - "bugfix/**"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  checks:
    name: "Run Checks (Python ${{ matrix.python-version }})"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: "Checkout Code"
        uses: "actions/checkout@v4"

      - name: "Set up Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "[1/5] Syntax Compilation"
        run: python -m compileall -q scripts tests main.py smc_main.py test_mt5.py

      - name: "[2/5] Dependency Sanity Check"
        run: python -m pip check

      - name: "[3/5] Lint Check"
        run: ruff check --no-cache .

      - name: "[4/5] Format Check"
        run: ruff format --check --no-cache .

      - name: "[5/5] Unit Tests"
        run: python -m unittest discover -s tests
