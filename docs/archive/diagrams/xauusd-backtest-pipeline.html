<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAUUSD Backtest Pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--soft:#7a8399;--accent:#eb6c36;--tint:rgba(235,108,54,.08);--rule:rgba(45,49,66,.12)}
    body{background:var(--paper);color:var(--ink);font-family:'Noto Sans Thai','Geist',sans-serif;padding:48px 32px;min-height:100vh}
    main{max-width:1200px;margin:auto}.eyebrow{font:500 8px 'Geist Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
    h1{font:400 32px 'Instrument Serif','Noto Sans Thai',serif;margin-bottom:8px}.subtitle{font-size:12px;color:var(--muted);margin-bottom:24px}
    .canvas{overflow-x:auto}svg{display:block;width:100%;min-width:1000px}.note{border-top:1px solid var(--rule);margin-top:16px;padding-top:12px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body><main>
  <p class="eyebrow">SYSTEM ARCHITECTURE · DATA FLOW</p>
  <h1>XAUUSD Backtest Pipeline</h1>
  <p class="subtitle">ภาพรวมการดึงข้อมูล CSV, รัน Simulation ด้วย SMC Backtester, และสรุปผล Log (อ้างอิง scripts/run_backtest.py)</p>
  <div class="canvas">
  <svg viewBox="0 0 1120 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bt-title bt-desc">
    <title id="bt-title">Backtest Pipeline</title>
    <desc id="bt-desc">Flow from CSV data loading to SMC Backtester simulation and reporting</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
    </defs>
    
    <rect width="1120" height="400" fill="#f5f5f5"/>
    
    <!-- ZONES -->
    <rect x="40" y="80" width="220" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="56" y="84" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="96" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">1. MARKET DATA</text>

    <rect x="300" y="80" width="460" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="316" y="84" width="88" height="12" rx="2" fill="#f5f5f5"/>
    <text x="360" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2. RUNNER &amp; CONFIG</text>

    <rect x="800" y="80" width="280" height="240" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <rect x="816" y="84" width="70" height="12" rx="2" fill="#f5f5f5"/>
    <text x="851" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">3. RESULTS</text>

    <!-- ARROWS -->
    <!-- CSV to DataLoader -->
    <path d="M 220 200 H 322" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="236" y="180" width="70" height="12" rx="2" fill="#f5f5f5"/><text x="271" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">load_csv()</text>

    <!-- DataLoader to Backtester -->
    <path d="M 470 200 H 552" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="486" y="180" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="508" y="189" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">df_m5, h1</text>

    <!-- Config args to Backtester (Vertical elbow) -->
    <path d="M 640 160 V 172" fill="none" stroke="#4f5d75" stroke-dasharray="4,3" stroke-width="1.2" marker-end="url(#arrow)"/>
    
    <!-- Backtester to Summary -->
    <path d="M 720 200 H 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="740" y="180" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="770" y="189" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SummaryObj</text>

    <!-- NODES -->
    <!-- Data Source: CSV -->
    <rect x="60" y="140" width="160" height="120" rx="6" fill="#f5f5f5"/>
    <rect x="60" y="140" width="160" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="68" y="146" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="84" y="155" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FILE</text>
    <text x="140" y="180" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Historical CSV Data</text>
    <text x="140" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XAUUSD_M5.csv</text>
    <text x="140" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XAUUSD_H1.csv</text>
    <text x="140" y="238" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(Fallback to M15 if missing)</text>

    <!-- CLI Runner -->
    <rect x="330" y="160" width="140" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="330" y="160" width="140" height="80" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
    <rect x="338" y="166" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="356" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PARSER</text>
    <text x="400" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run Config</text>
    <text x="400" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Profile (--demo, --small)</text>

    <!-- SMC Backtester (Focal) -->
    <rect x="560" y="140" width="160" height="120" rx="6" fill="#f5f5f5"/>
    <rect x="560" y="140" width="160" height="120" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="568" y="146" width="36" height="12" rx="2" fill="transparent" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="586" y="155" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
    <text x="640" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SMC Backtester</text>
    <text x="640" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Simulates Strategy</text>
    <text x="640" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Risk, TP_R, Break-Even</text>
    <text x="640" y="240" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">bt_optimized.run()</text>
    
    <!-- Config Profile (Above Backtester) -->
    <rect x="560" y="100" width="160" height="60" fill="transparent"/>
    <text x="640" y="120" fill="#4f5d75" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Account Rules (Balance, Risk)</text>
    <text x="640" y="134" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GOLD_V2_DEMO Defaults</text>

    <!-- Summary (Output) -->
    <rect x="840" y="160" width="200" height="100" rx="6" fill="#f5f5f5"/>
    <rect x="840" y="160" width="200" height="100" rx="6" fill="#fff" stroke="#2d3142" stroke-width="1"/>
    <rect x="848" y="166" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="864" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPORT</text>
    <text x="940" y="202" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Terminal Summary</text>
    <text x="940" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Win Rate, PnL, Max DD</text>
    <text x="940" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Trade Log (Entry/Exit, Lot Size)</text>
    <text x="940" y="250" fill="#2e5aa8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Two-tier eligibility check</text>

  </svg></div>
  <p class="note">Generated via diagram-design · Backtest Pipeline · 2026-09-28</p>
</main></body></html>
